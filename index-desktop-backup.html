<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"><title>Sakura Pomodoro Pro</title>
<style>
/* ============================================================
   RESET & ROOT
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#F472B6;--pink2:#E05A9E;--pink-light:#FBCFE8;--purple:#A78BFA;--gold:#FBBF24;
  --text:#fff;--text-sub:rgba(255,255,255,0.65);--text-dim:rgba(255,255,255,0.40);
  --radius:22px;--radius-sm:16px;
  --font:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
}
body{
  font-family:var(--font);color:var(--text);
  min-height:100vh;min-height:100dvh;overflow-x:hidden;
  background:#0f0f1a;
  user-select:none;-webkit-user-select:none;
}
/* ============================================================
   BACKGROUND
   ============================================================ */
#bg{position:fixed;inset:0;background-size:cover;background-position:center top;background-repeat:no-repeat;z-index:0;transition:background-image 1s ease;}
#bg-mask{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(170deg,rgba(10,10,20,0.18) 0%,rgba(10,10,20,0.02) 35%,rgba(10,10,20,0.05) 65%,rgba(10,10,20,0.38) 100%);}
#quote{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:2;pointer-events:none;text-align:center;max-width:78vw;font-size:0.85rem;font-weight:400;text-shadow:0 2px 20px rgba(0,0,0,0.7);line-height:1.6;transition:opacity 0.6s ease;color:rgba(255,255,255,0.80);}

/* ============================================================
   ANIME ICONS – Inline SVG
   ============================================================ */
.anime-icon{display:inline-block;vertical-align:middle;filter:drop-shadow(0 2px 4px rgba(244,114,182,0.3));}
.anime-icon.sm{width:20px;height:20px;}.anime-icon.md{width:28px;height:28px;}.anime-icon.lg{width:40px;height:40px;}

/* ============================================================
   HAMBURGER
   ============================================================ */
#hamburger{position:fixed;top:22px;left:22px;z-index:300;display:flex;align-items:center;gap:8px;cursor:pointer;background:transparent;border:none;border-radius:28px;padding:9px 16px;transition:all 0.3s ease;}
#hamburger:hover{background:rgba(244,114,182,0.08);}
#hamburger .hb-icon{width:18px;height:12px;position:relative;}
#hamburger .hb-icon span{display:block;position:absolute;height:1.5px;width:100%;background:#fff;border-radius:1px;transition:all 0.3s ease;left:0;}
#hamburger .hb-icon span:nth-child(1){top:0;}#hamburger .hb-icon span:nth-child(2){top:5px;}#hamburger .hb-icon span:nth-child(3){top:10px;}
#hamburger .hb-label{font-size:0.7rem;font-weight:500;color:var(--text-sub);}

#slide-menu{position:fixed;top:0;left:0;bottom:0;z-index:290;width:270px;max-width:80vw;background:rgba(18,18,38,0.72);border-right:1px solid rgba(255,255,255,0.06);transform:translateX(-100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);padding:88px 22px 30px;display:flex;flex-direction:column;gap:4px;}
#slide-menu.open{transform:translateX(0);}
#slide-menu button{display:flex;align-items:center;gap:10px;border:none;background:transparent;color:var(--text-sub);font-size:0.82rem;font-family:var(--font);padding:11px 14px;border-radius:12px;cursor:pointer;transition:all 0.2s ease;text-align:left;}
#slide-menu button:hover{background:rgba(244,114,182,0.08);color:#fff;}
#slide-menu .sm-icon{font-size:1rem;width:22px;text-align:center;}
#slide-menu .sm-divider{height:1px;background:rgba(255,255,255,0.05);margin:6px 0;}

/* ============================================================
   RIGHT NAV
   ============================================================ */
#side-nav{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:10px;}
#side-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:8px 6px;width:50px;cursor:pointer;transition:all 0.25s ease;font-family:var(--font);}
#side-nav button:hover{background:rgba(244,114,182,0.06);border-color:rgba(244,114,182,0.2);}
#side-nav button.on{background:rgba(244,114,182,0.12);border-color:rgba(244,114,182,0.35);box-shadow:0 0 16px rgba(244,114,182,0.15);}
#side-nav button .sn-icon{font-size:1.1rem;line-height:1;filter:drop-shadow(0 0 4px rgba(244,114,182,0.2));}
#side-nav button .sn-label{font-size:0.5rem;color:var(--text-dim);font-weight:500;}
#side-nav button.on .sn-label{color:var(--pink);}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{position:relative;z-index:10;max-width:500px;margin:0 auto;padding:30px 20px 40px;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;}
.panel{display:none;width:100%}.panel.show{display:block;animation:panelIn 0.35s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ============================================================
   GLASS CARD
   ============================================================ */
.glass{background:transparent;border:none;border-radius:var(--radius);padding:24px 22px;}

/* ============================================================
   TIMER CARD
   ============================================================ */
.timer-card{text-align:center;padding:36px 28px;max-width:400px;margin:0 auto;}
.mode-tabs{display:flex;gap:2px;justify-content:center;margin-bottom:24px;}
.mode-tabs button{border:none;background:transparent;font-size:0.7rem;color:var(--text-dim);padding:6px 18px;border-radius:16px;cursor:pointer;font-family:var(--font);font-weight:500;transition:all 0.25s ease;letter-spacing:0.5px;}
.mode-tabs button.on{background:rgba(244,114,182,0.20);color:#fff;}
.mode-tabs button:hover{color:#fff;}

.progress-wrap{position:relative;width:210px;height:210px;margin:0 auto 22px;}
.progress-wrap svg{width:210px;height:210px;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:rgba(255,255,255,0.05);stroke-width:5;}
.ring-fg{fill:none;stroke:var(--pink);stroke-width:5;stroke-linecap:round;stroke-dasharray:629;stroke-dashoffset:0;transition:stroke-dashoffset 0.35s ease;filter:drop-shadow(0 0 8px rgba(244,114,182,0.45)) drop-shadow(0 0 20px rgba(244,114,182,0.2));}
.timer-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.timer-face .lbl{font-size:0.6rem;color:var(--text-dim);letter-spacing:4px;text-transform:uppercase;}
.timer-face .time{font-size:2.8rem;font-weight:800;letter-spacing:3px;text-shadow:0 0 30px rgba(244,114,182,0.2);}

.timer-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
.btn{border:none;background:linear-gradient(135deg,#F472B6,#E05A9E);color:#fff;font-weight:600;font-size:0.85rem;padding:12px 38px;border-radius:30px;cursor:pointer;box-shadow:0 4px 20px rgba(244,114,182,0.35);font-family:var(--font);transition:all 0.25s ease;letter-spacing:0.5px;}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(244,114,182,0.50);}
.btn:active{transform:scale(0.96);}
.btn-ghost{border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);color:var(--text-sub);font-size:0.78rem;padding:10px 20px;border-radius:30px;cursor:pointer;font-family:var(--font);transition:all 0.25s ease;}
.btn-ghost:hover{background:rgba(255,255,255,0.10);color:#fff;}

.timer-info{display:flex;justify-content:center;gap:18px;font-size:0.68rem;color:var(--text-sub);}
.timer-info span{cursor:pointer;transition:color 0.2s;}
.timer-info span:hover{color:var(--pink);}

.xp-bar{height:3px;background:rgba(255,255,255,0.05);border-radius:3px;margin-top:12px;overflow:hidden;}
.xp-bar .fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--pink-light));border-radius:3px;transition:width 0.5s ease;}
#mode-recommend{font-size:0.58rem;color:rgba(244,114,182,0.45);margin-top:-8px;margin-bottom:8px;min-height:14px;}

/* ============================================================
   CONTENT PANELS
   ============================================================ */
.sec-title{font-size:0.92rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.sec-title .right{font-size:0.6rem;color:var(--text-sub);margin-left:auto;cursor:pointer;transition:color 0.2s;}
.sec-title .right:hover{color:var(--pink);}

/* Tasks */
.filter-row{display:flex;gap:4px;margin-bottom:7px;flex-wrap:wrap;}
.filter-row button{border:none;background:rgba(255,255,255,0.04);font-size:0.57rem;color:var(--text-dim);padding:3px 9px;border-radius:7px;cursor:pointer;font-family:var(--font);transition:all 0.2s;}
.filter-row button.on{background:rgba(244,114,182,0.25);color:#fff;font-weight:600;}
.task-list{display:flex;flex-direction:column;gap:5px;max-height:320px;overflow-y:auto;}
.task-row{display:flex;align-items:center;gap:8px;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.06);border-radius:0;padding:10px 12px;transition:all 0.2s ease;cursor:pointer;}
.task-row:hover{background:rgba(255,255,255,0.03);}
.task-row.done{opacity:0.4;}.task-row.done .ttl{text-decoration:line-through;}
.task-chk{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,0.25);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.task-row.done .task-chk{background:var(--pink);border-color:var(--pink);}
.task-chk svg{width:9px;height:9px;opacity:0;}.task-row.done .task-chk svg{opacity:1;}
.task-body{flex:1;min-width:0;}.ttl{font-weight:600;font-size:0.78rem;}
.task-meta{display:flex;gap:4px;margin-top:2px;font-size:0.55rem;color:var(--text-dim);flex-wrap:wrap;}
.task-quad{font-weight:600;font-size:0.53rem;padding:1px 5px;border-radius:3px;}
.task-quad.q1{background:rgba(255,107,107,0.15);color:#FF6B6B;}.task-quad.q2{background:rgba(255,217,61,0.15);color:#FFD93D;}
.task-quad.q3{background:rgba(107,203,119,0.15);color:#6BCB77;}.task-quad.q4{background:rgba(255,255,255,0.04);color:var(--text-faint);}
.task-acts{display:flex;gap:1px;flex-shrink:0;}.task-acts button{border:none;background:transparent;font-size:0.68rem;padding:3px;cursor:pointer;border-radius:3px;color:var(--text-dim);}.task-acts button:hover{background:rgba(255,255,255,0.06);color:#fff;}

/* Check-in */
.ci-hero{text-align:center;padding:28px 22px;}
.ci-hero h3{font-size:1.05rem;font-weight:700;margin-bottom:5px;}
.ci-hero .sub{color:var(--text-dim);font-size:0.7rem;margin-bottom:14px;}
.streak-row{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:10px;font-size:0.85rem;font-weight:700;}
.streak-row .sf{font-size:1.2rem;}.streak-row .ss{color:var(--text-dim);font-weight:400;font-size:0.7rem;}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:10px;}
.calendar .dl{font-size:0.5rem;color:rgba(255,255,255,0.12);font-weight:600;padding:2px 0;}
.calendar .dc{aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:0.55rem;font-weight:500;color:rgba(255,255,255,0.45);}
.calendar .dc.l1{background:rgba(244,114,182,0.10);}.calendar .dc.l2{background:rgba(244,114,182,0.22);}.calendar .dc.l3{background:rgba(244,114,182,0.36);}.calendar .dc.l4{background:rgba(244,114,182,0.55);color:#fff;}
.calendar .dc.today{border:2px solid var(--pink);font-weight:700;color:#fff;}.calendar .dc.future{color:rgba(255,255,255,0.06);}
.mood-sel{display:none;margin-top:12px;}.mood-sel.show{display:block;}
.mood-sel p{font-size:0.64rem;color:var(--text-dim);margin-bottom:7px;}
.mood-opts{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;}
.mood-opts button{border:2px solid transparent;background:rgba(255,255,255,0.03);font-size:1.1rem;padding:5px 8px;border-radius:8px;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;}
.mood-opts button span{font-size:0.44rem;color:var(--text-dim);}.mood-opts button:hover{border-color:var(--pink);}.mood-opts button.pk{border-color:var(--pink2);background:rgba(244,114,182,0.10);}
.cn{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}

/* Gallery */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:400px;overflow-y:auto;}
.gallery .gi{aspect-ratio:3/4;border-radius:11px;background-size:cover;background-position:center;cursor:pointer;position:relative;transition:all 0.3s ease;}
.gallery .gi:hover{transform:scale(1.04);box-shadow:0 8px 30px rgba(0,0,0,0.35);}
.gallery .gi.locked{filter:brightness(0.08) blur(10px);}
.gallery .gi.locked::after{content:'🔒';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem;}

/* Stats */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px;}
.stat-card{text-align:center;padding:18px 10px;background:transparent;border:none;}
.stat-card .si{font-size:1.2rem;margin-bottom:3px;}.stat-card .sv{font-size:1.5rem;font-weight:700;color:var(--pink);text-shadow:0 0 16px rgba(244,114,182,0.25);}.stat-card .sl{font-size:0.55rem;color:var(--text-dim);margin-top:2px;}
.badge-grid{display:flex;flex-wrap:wrap;gap:6px;}
.badge-item{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);border-radius:12px;padding:10px 14px;text-align:center;font-size:0.62rem;opacity:0.22;transition:all 0.3s ease;}
.badge-item.earned{opacity:1;border-color:rgba(244,114,182,0.25);background:rgba(244,114,182,0.06);}
.badge-item .bi{font-size:1.4rem;}.badge-item .bn{font-weight:700;margin-top:2px;}.badge-item .bd2{font-size:0.48rem;color:var(--text-dim);margin-top:1px;}
.hist-list{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto;}
.hist-day{margin-bottom:3px;}.hist-day .hdl{font-size:0.6rem;color:var(--text-dim);margin-bottom:1px;}
.hist-sessions{display:flex;flex-wrap:wrap;gap:2px;}.hist-s{background:rgba(244,114,182,0.10);padding:1px 7px;border-radius:5px;font-size:0.5rem;color:rgba(255,255,255,0.4);}

/* ============================================================
   MODALS
   ============================================================ */
.modal{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.40);display:flex;align-items:center;justify-content:center;padding:14px;}
.modal[hidden]{display:none;}
.modal-inner{background:rgba(22,22,45,0.78);border:1px solid rgba(255,255,255,0.14);border-radius:var(--radius);padding:26px 22px;max-width:400px;width:100%;max-height:78vh;overflow-y:auto;position:relative;animation:modalIn 0.28s ease;box-shadow:0 16px 48px rgba(0,0,0,0.25);}
@keyframes modalIn{from{transform:translateY(14px) scale(0.97);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.modal-inner h2{font-size:0.95rem;font-weight:700;margin-bottom:14px;}
.modal-close{position:absolute;top:10px;right:14px;border:none;background:rgba(255,255,255,0.06);color:var(--text-dim);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:0.8rem;transition:all 0.2s;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:rgba(255,255,255,0.14);color:#fff;}

.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;}
.mode-item{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);padding:12px 10px;cursor:pointer;text-align:center;transition:all 0.25s ease;}
.mode-item:hover{border-color:rgba(244,114,182,0.35);background:rgba(244,114,182,0.06);}
.mode-item.sel{border-color:var(--pink);background:rgba(244,114,182,0.12);box-shadow:0 0 16px rgba(244,114,182,0.12);}
.mode-item .mi{font-size:1.3rem;}.mode-item .mn{font-size:0.7rem;font-weight:600;margin-top:3px;}.mode-item .md{font-size:0.54rem;color:var(--text-dim);margin-top:1px;}

.set-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.03);}
.set-row label{font-size:0.76rem;color:var(--text-sub);}
.num-ctrl{display:flex;align-items:center;gap:3px;}
.num-ctrl button{border:none;background:var(--pink);color:#fff;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:0.68rem;font-family:var(--font);transition:all 0.2s;}
.num-ctrl button:active{transform:scale(0.9);}
.num-ctrl span{font-weight:700;min-width:16px;text-align:center;font-size:0.72rem;}
.toggle{width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,0.10);cursor:pointer;position:relative;transition:background 0.3s;}
.toggle.on{background:var(--pink);}.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left 0.3s;}.toggle.on::after{left:18px;}
.modal-inner input[type=range]{width:70px;accent-color:var(--pink);}
.modal-inner input[type=text]{border:1px solid rgba(255,255,255,0.10);border-radius:7px;padding:6px 9px;font-size:0.72rem;background:rgba(255,255,255,0.03);color:#fff;outline:none;width:100%;font-family:var(--font);}
.modal-inner input[type=text]:focus{border-color:var(--pink);}
.modal-inner hr{border:none;border-top:1px solid rgba(255,255,255,0.04);margin:8px 0;}
.btn-danger{background:#E74C3C;color:#fff;border:none;padding:6px 12px;border-radius:9px;cursor:pointer;font-weight:600;font-size:0.7rem;font-family:var(--font);transition:all 0.2s;}
.btn-danger:hover{background:#C0392B;}
.btn-sm{border:none;background:rgba(244,114,182,0.18);color:var(--pink);font-size:0.6rem;padding:4px 10px;border-radius:7px;cursor:pointer;font-family:var(--font);}
#tfm{display:flex;flex-direction:column;gap:7px;}
#tfm input,#tfm textarea,#tfm select{border:1px solid rgba(255,255,255,0.10);border-radius:7px;padding:6px 9px;font-size:0.74rem;background:rgba(255,255,255,0.03);color:#fff;outline:none;font-family:var(--font);}
#tfm input:focus,#tfm textarea:focus,#tfm select:focus{border-color:var(--pink);}
#tfm textarea{resize:vertical;min-height:40px;}#tfm select option{background:#1a1a2e;color:#fff;}
.form-acts{display:flex;gap:5px;justify-content:flex-end;margin-top:3px;}

/* Toast, Unlock, Empty */
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:500;background:rgba(18,18,38,0.82);color:#fff;padding:7px 18px;border-radius:22px;font-size:0.66rem;pointer-events:none;border:1px solid rgba(255,255,255,0.12);animation:toastIn 0.3s ease,toastOut 0.3s ease 2.2s forwards;}
@keyframes toastIn{from{transform:translateX(-50%) translateY(-8px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
@keyframes toastOut{from{transform:translateX(-50%) translateY(0);opacity:1}to{transform:translateX(-50%) translateY(-8px);opacity:0}}
.unlock-overlay{position:fixed;inset:0;z-index:350;pointer-events:none;display:flex;align-items:center;justify-content:center;}
.unlock-overlay[hidden]{display:none;}
.unlock-inner{text-align:center;animation:celebIn 0.5s ease;}
.unlock-inner .ue{font-size:3.5rem;display:block;}.unlock-inner .ut{font-size:1.2rem;font-weight:700;margin-top:6px;}.unlock-inner .us{font-size:0.7rem;color:var(--text-sub);margin-top:3px;}
@keyframes celebIn{0%{transform:scale(0.3);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.empty-state{text-align:center;padding:34px 18px;color:var(--text-dim);font-size:0.74rem;}
#err{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#e74c3c;color:#fff;padding:5px;font-size:10px;text-align:center;}

/* ============================================================
   ANIME SPARKLE DECORATION (scattered around UI)
   ============================================================ */
.sparkle{position:absolute;pointer-events:none;opacity:0.6;animation:sparkleFloat 3s ease-in-out infinite;}
.sparkle:nth-child(odd){animation-delay:1.5s;}
@keyframes sparkleFloat{0%,100%{transform:translateY(0) scale(1);opacity:0.4;}50%{transform:translateY(-6px) scale(1.3);opacity:0.8;}}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(min-width:769px){.stats-grid{grid-template-columns:repeat(4,1fr);}.gallery{grid-template-columns:repeat(4,1fr);}#side-nav{right:24px;gap:12px;}#side-nav button{width:52px;padding:9px 6px;}#quote{font-size:0.95rem;}}
@media(max-width:768px){#app{padding:20px 70px 40px 20px;}#side-nav{right:10px;gap:8px;}#side-nav button{width:44px;padding:7px 5px;border-radius:13px;}#side-nav button .sn-icon{font-size:1rem;}#side-nav button .sn-label{font-size:0.45rem;}#hamburger{top:14px;left:14px;padding:7px 12px;}#hamburger .hb-label{font-size:0.66rem;}.timer-card{padding:24px 16px;}.timer-face .time{font-size:2.2rem;}.progress-wrap{width:170px;height:170px;}.progress-wrap svg{width:170px;height:170px;}}

<script>
window.onerror=function(m,u,l){var e=document.getElementById('err');if(e){e.style.display='block';e.textContent='Error: '+m+' (line '+l+')';}return false;};
function $(id){return document.getElementById(id);}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2500);}
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function todayStr(){return new Date().toISOString().slice(0,10);}

var KEYS={S:'skpro_s4',SS:'skpro_ss4',T:'skpro_t4',C:'skpro_c4',F:'skpro_f4',M:'skpro_m4',X:'skpro_x4'};
var DEFS={settings:{wd:25,sd:5,ld:15,li:4,ab:true,aw:false,snd:true,vol:0.7,curMode:0,cu:'',imgIdx:0,xp:0},sessions:[],tasks:[],checkins:{},favorites:[],customModes:[],xpLog:{badges:[]}};
function safeGet(k){try{var r=localStorage.getItem(k);if(r===null||r===undefined||r==='undefined'||r==='null')return null;return JSON.parse(r);}catch(e){return null;}}
function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function loadData(){var s=safeGet(KEYS.S);settings=(s&&typeof s==='object'&&!Array.isArray(s))?mergeDef(DEFS.settings,s):JSON.parse(JSON.stringify(DEFS.settings));var ss=safeGet(KEYS.SS);sessions=Array.isArray(ss)?ss:[];var t=safeGet(KEYS.T);tasks=Array.isArray(t)?t:[];var c=safeGet(KEYS.C);checkins=(c&&typeof c==='object'&&!Array.isArray(c))?c:{};var f=safeGet(KEYS.F);favorites=Array.isArray(f)?f:[];var m=safeGet(KEYS.M);customModes=Array.isArray(m)?m:[];var x=safeGet(KEYS.X);xpData=(x&&typeof x==='object')?mergeDef(DEFS.xpLog,x):JSON.parse(JSON.stringify(DEFS.xpLog));if(!xpData.badges)xpData.badges=[];}
function mergeDef(def,data){if(typeof def!=='object'||def===null)return data!==undefined?data:def;if(Array.isArray(def)){if(!Array.isArray(data))return JSON.parse(JSON.stringify(def));return data;}var o={};if(!data||typeof data!=='object'||Array.isArray(data))data={};for(var k in def){o[k]=(data&&data.hasOwnProperty(k))?mergeDef(def[k],data[k]):def[k];}return o;}

var actx=null,again=null,aOn=true,aVol=0.7;
function aInit(){try{actx=new(window.AudioContext||window.webkitAudioContext)();again=actx.createGain();again.connect(actx.destination);}catch(e){aOn=false;}}
function aOk(){if(!actx)return false;if(actx.state==='suspended')actx.resume();if(again)again.gain.value=aVol;return aOn;}
function beep(f,d,t){t=t||'sine';if(!aOk())return;var n=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0.001,n);g.gain.exponentialRampToValueAtTime(0.2,n+0.02);g.gain.exponentialRampToValueAtTime(0.001,n+d);o.connect(g);g.connect(again);o.start(n);o.stop(n+d+0.05);}
function sfxStart(){beep(440,0.1);setTimeout(function(){beep(554,0.14);},80);}
function sfxDone(){beep(523,0.1);setTimeout(function(){beep(659,0.2);},110);setTimeout(function(){beep(784,0.16);},220);}
function sfxMilestone(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){beep(f,0.1);},i*60);});}
function sfxCheckin(){beep(784,0.14);}
function sfxUnlock(){beep(1047,0.1);setTimeout(function(){beep(1319,0.15);},80);setTimeout(function(){beep(1568,0.2);},160);}

var settings,sessions,tasks,checkins,favorites,customModes,xpData;
var curImgIdx=0,imgBusy=false,TOTAL_IMAGES=30;

var PRESET_MODES=[{id:'classic',name:'经典番茄',work:25,brk:5,long:15,ico:'tomato',desc:'通用、初学、克服拖延',recH:[0,24]},{id:'deep',name:'深度工作',work:90,brk:20,long:30,ico:'muscle',desc:'编程、写作、战略思考',recH:[6,12]},{id:'flow',name:'心流模式',work:0,brk:0,long:0,ico:'wave',desc:'自由计时，保护心流状态',recH:[6,18]},{id:'sprint',name:'快速冲刺',work:15,brk:3,long:10,ico:'lightning',desc:'低动力时快速启动',recH:[14,24]},{id:'writer',name:'写作模式',work:50,brk:10,long:20,ico:'pen',desc:'写作、阅读、批注',recH:[6,14]},{id:'anime',name:'动画奖励',work:50,brk:20,long:20,ico:'clapper',desc:'完成即奖励一集动漫',recH:[12,24]},{id:'exam',name:'考试模式',work:25,brk:5,long:15,ico:'books',desc:'间隔重复+科目交替',recH:[8,20]},{id:'morning',name:'晨间巅峰',work:52,brk:17,long:30,ico:'sunrise',desc:'上午高能量黄金时段',recH:[6,12]},{id:'night',name:'夜猫模式',work:30,brk:10,long:15,ico:'moon',desc:'晚间较低能量适应',recH:[18,24]},{id:'speed20',name:'20/10速学',work:20,brk:10,long:10,ico:'microscope',desc:'高强度记忆新知识',recH:[6,18]}];
var allModes=[];
function rebuildModes(){allModes=PRESET_MODES.concat(customModes);}
function getCurrentMode(){rebuildModes();var idx=settings.curMode||0;if(idx>=allModes.length)idx=0;return allModes[idx];}

function saveCustomMode(){var name=$('custom-name').value.trim();if(!name){toast('请输入模式名称');return;}var icon=$('custom-icon').value.trim()||'📌';var work=parseInt($('vcw').textContent)||25;var brk=parseInt($('vcb').textContent)||5;var m={id:'custom_'+Date.now(),name:icon+' '+name,work:work,brk:brk,long:15,icon:icon,desc:'自定义模式',recH:[0,24]};if(editingCustomIdx>=0){customModes[editingCustomIdx]=m;}else{customModes.push(m);}safeSet(KEYS.M,customModes);$('modal-custom').hidden=true;renderModeGrid();toast('已保存');}
function deleteCustomMode(){if(editingCustomIdx>=0&&confirm('确定删除？')){customModes.splice(editingCustomIdx,1);safeSet(KEYS.M,customModes);$('modal-custom').hidden=true;renderModeGrid();toast('已删除');}}

function settingsOpen(){$('modal-settings').hidden=false;$('tgl-ab').classList.toggle('on',settings.ab);$('tgl-aw').classList.toggle('on',settings.aw);$('tgl-snd').classList.toggle('on',settings.snd);$('rng-vol').value=Math.round(settings.vol*100);$('inp-url').value=settings.cu||'';}
function settingsClose(){$('modal-settings').hidden=true;tRecalc();tUpdDisp();tUpdRing();}
function settingsApplyUrl(){var u=$('inp-url').value.trim();if(!u){toast('请输入URL');return;}settings.cu=u;safeSet(KEYS.S,settings);$('bg').style.backgroundImage='url('+u+')';settingsClose();toast('已应用！');}
function settingsExport(){var d={settings:settings,sessions:sessions,tasks:tasks,checkins:checkins,favorites:favorites,customModes:customModes,xpData:xpData};var j=JSON.stringify(d,null,2);var b=new Blob([j],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sakura-pro-'+todayStr()+'.json';a.click();URL.revokeObjectURL(a.href);toast('已导出！');}
function settingsReset(){if(confirm('确定清除所有数据？不可恢复！')){Object.values(KEYS).forEach(function(k){localStorage.removeItem(k);});location.reload();}}

var curTab='timer';
function goTab(t){if(t===curTab)return;document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('show');});var panel=$('panel-'+t);if(panel)panel.classList.add('show');document.querySelectorAll('#side-nav button[data-tab]').forEach(function(b){b.classList.toggle('on',b.dataset.tab===t);});curTab=t;if(t==='stats'){rStats();renderBadges();}if(t==='checkin')cCalendar();if(t==='tasks')taskRender();if(t==='gallery')renderGallery();}

function init(){
  loadData();aOn=settings.snd;aVol=settings.vol;rebuildModes();cInit();
  TOTAL_IMAGES=0;var pi=0,mp=500;
  function probeNext(){if(pi>=mp){if(TOTAL_IMAGES===0)TOTAL_IMAGES=30;finishInit();return;}var name='img/w'+String(pi+1).padStart(4,'0')+'.jpg';var p=new Image();p.onload=function(){TOTAL_IMAGES=pi+1;pi++;probeNext();};p.onerror=function(){if(TOTAL_IMAGES===0)TOTAL_IMAGES=Math.max(30,pi);finishInit();};p.src=name;}
  function finishInit(){$('total-count').textContent=TOTAL_IMAGES;$('unlocked-count').textContent=unlockedCount();if(curImgIdx>=TOTAL_IMAGES){curImgIdx=0;settings.imgIdx=0;safeSet(KEYS.S,settings);}imgShow(curImgIdx);renderGallery();updateXPBar();}
  curImgIdx=settings.imgIdx>=0&&settings.imgIdx<Math.max(TOTAL_IMAGES,30)?settings.imgIdx:Math.floor(Math.random()*Math.max(TOTAL_IMAGES,30));
  tRecalc();tCountToday();tUpdDisp();tUpdRing();updateModeDisplay();cHero();cStreakRender();cCalendar();taskRender();rStats();renderBadges();updateXPBar();
  probeNext();

  $('bstart').addEventListener('click',function(){aInit();tStart();});$('bpause').addEventListener('click',tPause);$('breset').addEventListener('click',tReset);$('bskip').addEventListener('click',tSkip);
  document.querySelectorAll('.mode-tabs button').forEach(function(b){b.addEventListener('click',function(){tSwitch(b.dataset.mode);document.querySelectorAll('.mode-tabs button').forEach(function(x){x.classList.toggle('on',x.dataset.mode===b.dataset.mode);});});});

  $('bclose-mode')?($('bclose-mode').addEventListener('click',function(){$('modal-mode').hidden=true;})):null;
  $('bcustom-mode')?($('bcustom-mode').addEventListener('click',function(){$('modal-mode').hidden=true;openCustomMode(-1);})):null;
  $('bclose-custom')?($('bclose-custom').addEventListener('click',function(){$('modal-custom').hidden=true;})):null;
  $('bsave-custom')?($('bsave-custom').addEventListener('click',saveCustomMode)):null;
  $('bdel-custom')?($('bdel-custom').addEventListener('click',deleteCustomMode)):null;
  $('dcw')?($('dcw').addEventListener('click',function(){$('vcw').textContent=Math.max(1,(parseInt($('vcw').textContent)||25)-5);})):null;
  $('icw')?($('icw').addEventListener('click',function(){$('vcw').textContent=Math.min(120,(parseInt($('vcw').textContent)||25)+5);})):null;
  $('dcb')?($('dcb').addEventListener('click',function(){$('vcb').textContent=Math.max(1,(parseInt($('vcb').textContent)||5)-5);})):null;
  $('icb')?($('icb').addEventListener('click',function(){$('vcb').textContent=Math.min(60,(parseInt($('vcb').textContent)||5)+5);})):null;

  $('bat')?($('bat').addEventListener('click',function(){taskOpen('');})):null;
  $('tfm')?($('tfm').addEventListener('submit',function(e){e.preventDefault();taskSave();})):null;
  $('bcancel-task')?($('bcancel-task').addEventListener('click',taskClose)):null;
  $('bclose-task')?($('bclose-task').addEventListener('click',taskClose)):null;
  $('modal-task')?($('modal-task').addEventListener('click',function(e){if(e.target.id==='modal-task')taskClose();})):null;
  $('quad-filt')?($('quad-filt').addEventListener('click',function(e){if(e.target.dataset.q){taskFilter.quad=e.target.dataset.q;document.querySelectorAll('#quad-filt button').forEach(function(b){b.classList.toggle('on',b.dataset.q===taskFilter.quad);});taskRender();}})):null;
  $('status-filt')?($('status-filt').addEventListener('click',function(e){if(e.target.dataset.st){taskFilter.st=e.target.dataset.st;document.querySelectorAll('#status-filt button').forEach(function(b){b.classList.toggle('on',b.dataset.st===taskFilter.st);});taskRender();}})):null;

  $('bci')?($('bci').addEventListener('click',cDo)):null;
  $('mood-opts')?($('mood-opts').addEventListener('click',function(e){var b=e.target.closest('button[data-mood]');if(b)cMood(b.dataset.mood);})):null;
  $('cpr')?($('cpr').addEventListener('click',function(){cNav(-1);})):null;
  $('cnx')?($('cnx').addEventListener('click',function(){cNav(1);})):null;

  $('bapply-url')?($('bapply-url').addEventListener('click',settingsApplyUrl)):null;
  $('bexport')?($('bexport').addEventListener('click',settingsExport)):null;
  $('breset')?($('breset').addEventListener('click',settingsReset)):null;
  $('bclose-settings')?($('bclose-settings').addEventListener('click',settingsClose)):null;
  $('tgl-ab')?($('tgl-ab').addEventListener('click',function(){this.classList.toggle('on');settings.ab=this.classList.contains('on');safeSet(KEYS.S,settings);})):null;
  $('tgl-aw')?($('tgl-aw').addEventListener('click',function(){this.classList.toggle('on');settings.aw=this.classList.contains('on');safeSet(KEYS.S,settings);})):null;
  $('tgl-snd')?($('tgl-snd').addEventListener('click',function(){this.classList.toggle('on');settings.snd=this.classList.contains('on');aOn=this.classList.contains('on');safeSet(KEYS.S,settings);})):null;
  $('rng-vol')?($('rng-vol').addEventListener('input',function(){settings.vol=parseInt(this.value)/100;aVol=settings.vol;safeSet(KEYS.S,settings);})):null;

  var ham=$('hamburger'),slide=$('slide-menu'),menuOpen=false;
  if(ham)ham.addEventListener('click',function(){menuOpen=!menuOpen;if(menuOpen)slide.classList.add('open');else slide.classList.remove('open');});
  document.addEventListener('click',function(e){if(menuOpen&&!slide.contains(e.target)&&!ham.contains(e.target)){menuOpen=false;slide.classList.remove('open');}});
  $('sm-mode')?($('sm-mode').addEventListener('click',function(){renderModeGrid();$('modal-mode').hidden=false;menuOpen=false;slide.classList.remove('open');})):null;
  $('sm-custom')?($('sm-custom').addEventListener('click',function(){openCustomMode(-1);menuOpen=false;slide.classList.remove('open');})):null;
  $('sm-settings')?($('sm-settings').addEventListener('click',function(){settingsOpen();menuOpen=false;slide.classList.remove('open');})):null;
  $('sm-fav')?($('sm-fav').addEventListener('click',function(){imgFav();menuOpen=false;slide.classList.remove('open');})):null;
  $('sm-export')?($('sm-export').addEventListener('click',function(){settingsExport();menuOpen=false;slide.classList.remove('open');})):null;
  $('sm-reset')?($('sm-reset').addEventListener('click',function(){settingsReset();menuOpen=false;slide.classList.remove('open');})):null;

  document.querySelectorAll('#side-nav button[data-tab]').forEach(function(b){b.addEventListener('click',function(){goTab(b.dataset.tab);});});

  document.addEventListener('visibilitychange',function(){if(document.hidden){if(tStatus==='running')tHidden=Date.now();}else{if(tStatus==='running'&&tHidden){var el=Math.floor((Date.now()-tHidden)/1000);tRem=Math.max(0,tRem-el);if(tRem<=0)tDone();else{tUpdDisp();tUpdRing();}}tHidden=null;}});
  // Left/right click zones for prev/next image
  document.addEventListener('click',function(e){
    // Don't trigger if clicking on UI elements (buttons, panels, modals, nav)
    if(e.target.closest('button')||e.target.closest('#app')||e.target.closest('#hamburger')||e.target.closest('#slide-menu')||e.target.closest('.modal')||e.target.closest('#side-nav'))return;
    var x=e.clientX,w=window.innerWidth;
    if(x<w/2)imgPrev();else imgNext();
  });
  document.addEventListener('click',function(){aInit();},{once:true});
  window.addEventListener('storage',function(e){if(!e.key||e.key.indexOf('skpro_s4')!==0)return;loadData();tRecalc();tUpdDisp();tUpdRing();updateModeDisplay();taskRender();cHero();cStreakRender();cCalendar();renderGallery();rStats();renderBadges();updateXPBar();});
  setInterval(function(){checkBadges();},30000);
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body></html>
